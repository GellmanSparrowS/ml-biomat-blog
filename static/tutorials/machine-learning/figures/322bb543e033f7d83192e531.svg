<svg role="img" aria-label="残差模块的计算分路：上方学习修正量，下方直接传递输入，在相加处合并并经过ReLU。数值例采用非负输入；蓝色直接路径和橙色修正路径共同组成输出。此图按计算定义原创绘制。" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360"><rect width="1100" height="360" fill="#fff"/><defs><marker id="M12-F6-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#54717c"/></marker></defs><path d="M150 165 H295 V85 H425 M150 165 H295 V260 H705 V165 M625 85 H705 V165 M735 165 H820 M955 165 H1040" fill="none" stroke="#54717c" stroke-width="3" marker-end="url(#M12-F6-arrow)"/><path d="M295 165 V260 H705" fill="none" stroke="#0072B2" stroke-width="5"/><rect x="425" y="45" width="200" height="80" rx="8" fill="#fff0d8" stroke="#D58500"/><circle cx="705" cy="165" r="28" fill="#fff" stroke="#54717c" stroke-width="3"/><rect x="820" y="125" width="135" height="80" rx="8" fill="#e7f2ef" stroke="#008675"/><text x="90" y="158" font-size="23" fill="#203841" text-anchor="middle">x</text><text x="90" y="190" font-size="18" fill="#203841" text-anchor="middle">(0.8, 0.4)</text><text x="525" y="78" font-size="23" fill="#203841" text-anchor="middle">学习修正</text><text x="525" y="109" font-size="18" fill="#203841" text-anchor="middle">F(x) = (−0.2, 0.1)</text><text x="705" y="174" font-size="29" fill="#203841" text-anchor="middle">+</text><text x="887" y="173" font-size="23" fill="#203841" text-anchor="middle">ReLU</text><text x="1020" y="227" font-size="19" fill="#203841" text-anchor="middle">(0.6, 0.5)</text><text x="475" y="300" font-size="22" fill="#0072B2" text-anchor="middle">直接保留输入</text><text x="550" y="342" font-size="20" fill="#203841" text-anchor="middle">形状匹配 → 逐元素相加 → 非线性激活</text></svg>