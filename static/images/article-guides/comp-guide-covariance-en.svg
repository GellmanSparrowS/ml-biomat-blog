<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img"><title>What the covariance matrix contains</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526678"/></marker></defs><rect width="760" height="460" rx="16" fill="#f7fafc"/>
<text x="30" y="42" font-family="&quot;Microsoft YaHei&quot;,&quot;Noto Sans SC&quot;,Arial,sans-serif" font-size="26" fill="#203348" text-anchor="start" font-weight="600">What the covariance matrix contains</text>
<text x="30" y="76" font-family="&quot;Microsoft YaHei&quot;,&quot;Noto Sans SC&quot;,Arial,sans-serif" font-size="18" fill="#526678" text-anchor="start" font-weight="400">Teaching covariance for slope m and intercept b</text>
<rect x="30" y="125" width="70" height="60" rx="0" fill="#eaf1fa" stroke="#d6e1ec"/>
<text x="65.0" y="162.0" font-family="&quot;Microsoft YaHei&quot;,&quot;Noto Sans SC&quot;,Arial,sans-serif" font-size="20" fill="#203348" text-anchor="middle" font-weight="600"></text>
<rect x="100" y="125" width="120" height="60" rx="0" fill="#eaf1fa" stroke="#d6e1ec"/>
<text x="160.0" y="162.0" font-family="&quot;Microsoft YaHei&quot;,&quot;Noto Sans SC&quot;,Arial,sans-serif" font-size="20" fill="#203348" text-anchor="middle" font-weight="600">m</text>
<rect x="220" y="125" width="120" height="60" rx="0" fill="#eaf1fa" stroke="#d6e1ec"/>
<text x="280.0" y="162.0" font-family="&quot;Microsoft YaHei&quot;,&quot;Noto Sans SC&quot;,Arial,sans-serif" font-size="20" fill="#203348" text-anchor="middle" font-weight="600">b</text>
<rect x="30" y="185" width="70" height="60" rx="0" fill="white" stroke="#d6e1ec"/>
<text x="65.0" y="222.0" font-family="&quot;Microsoft YaHei&quot;,&quot;Noto Sans SC&quot;,Arial,sans-serif" font-size="20" fill="#203348" text-anchor="middle" font-weight="400">m</text>
<rect x="100" y="185" width="120" height="60" rx="0" fill="white" stroke="#d6e1ec"/>
<text x="160.0" y="222.0" font-family="&quot;Microsoft YaHei&quot;,&quot;Noto Sans SC&quot;,Arial,sans-serif" font-size="20" fill="#203348" text-anchor="middle" font-weight="400">0.040</text>
<rect x="220" y="185" width="120" height="60" rx="0" fill="white" stroke="#d6e1ec"/>
<text x="280.0" y="222.0" font-family="&quot;Microsoft YaHei&quot;,&quot;Noto Sans SC&quot;,Arial,sans-serif" font-size="20" fill="#203348" text-anchor="middle" font-weight="400">−0.015</text>
<rect x="30" y="245" width="70" height="60" rx="0" fill="white" stroke="#d6e1ec"/>
<text x="65.0" y="282.0" font-family="&quot;Microsoft YaHei&quot;,&quot;Noto Sans SC&quot;,Arial,sans-serif" font-size="20" fill="#203348" text-anchor="middle" font-weight="400">b</text>
<rect x="100" y="245" width="120" height="60" rx="0" fill="white" stroke="#d6e1ec"/>
<text x="160.0" y="282.0" font-family="&quot;Microsoft YaHei&quot;,&quot;Noto Sans SC&quot;,Arial,sans-serif" font-size="20" fill="#203348" text-anchor="middle" font-weight="400">−0.015</text>
<rect x="220" y="245" width="120" height="60" rx="0" fill="white" stroke="#d6e1ec"/>
<text x="280.0" y="282.0" font-family="&quot;Microsoft YaHei&quot;,&quot;Noto Sans SC&quot;,Arial,sans-serif" font-size="20" fill="#203348" text-anchor="middle" font-weight="400">0.010</text>
<text x="385" y="155" font-family="&quot;Microsoft YaHei&quot;,&quot;Noto Sans SC&quot;,Arial,sans-serif" font-size="22" fill="#386fd1" text-anchor="start" font-weight="600">Diagonal → standard errors</text>
<text x="385" y="198" font-family="&quot;Microsoft YaHei&quot;,&quot;Noto Sans SC&quot;,Arial,sans-serif" font-size="21" fill="#203348" text-anchor="start" font-weight="400">SE(m) = √0.040 = 0.200</text>
<text x="385" y="238" font-family="&quot;Microsoft YaHei&quot;,&quot;Noto Sans SC&quot;,Arial,sans-serif" font-size="21" fill="#203348" text-anchor="start" font-weight="400">SE(b) = √0.010 = 0.100</text>
<text x="385" y="300" font-family="&quot;Microsoft YaHei&quot;,&quot;Noto Sans SC&quot;,Arial,sans-serif" font-size="22" fill="#13887f" text-anchor="start" font-weight="600">Off-diagonal → correlation</text>
<text x="385" y="343" font-family="&quot;Microsoft YaHei&quot;,&quot;Noto Sans SC&quot;,Arial,sans-serif" font-size="20" fill="#203348" text-anchor="start" font-weight="400">ρ = −0.015 / (0.2 × 0.1)</text>
<text x="385" y="376" font-family="&quot;Microsoft YaHei&quot;,&quot;Noto Sans SC&quot;,Arial,sans-serif" font-size="20" fill="#203348" text-anchor="start" font-weight="400">   = −0.75</text>
<text x="30" y="437" font-family="&quot;Microsoft YaHei&quot;,&quot;Noto Sans SC&quot;,Arial,sans-serif" font-size="18" fill="#526678" text-anchor="start" font-weight="400">A 95% interval also needs a multiplier and the model assumptions.</text></svg>