<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Periodic distance crosses the boundary</title><desc id="desc">One coordinate illustrates the minimum-image convention.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans SC","Noto Sans CJK SC",Arial,sans-serif;fill:#182f43}path,line,polyline{stroke-linecap:round;stroke-linejoin:round}</style>
<rect x="1" y="1" width="758" height="538" rx="16" fill="#f8fafc" stroke="#dce5ec"/>
<text x="30.00" y="42.00" font-size="27" fill="#182f43" style="fill:#182f43" text-anchor="start" font-weight="700">Periodic distance crosses the boundary</text>
<text x="30.00" y="72.00" font-size="18" fill="#486174" style="fill:#486174" text-anchor="start" font-weight="400">One coordinate illustrates the minimum-image convention.</text>
<rect x="130" y="155" width="480" height="210" rx="0" fill="#edf5f8" stroke="#92adbd" stroke-width="2"/>
<line x1="130.00" y1="136.00" x2="130.00" y2="388.00" stroke="#486174" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="610.00" y1="136.00" x2="610.00" y2="388.00" stroke="#486174" stroke-width="2" stroke-dasharray="6 6"/>
<circle cx="178.00" cy="254.00" r="16" fill="#2563eb" stroke="none" stroke-width="2"/>
<circle cx="562.00" cy="254.00" r="16" fill="#087f75" stroke="none" stroke-width="2"/>
<circle cx="82.00" cy="254.00" r="16" fill="#b0d8d1" stroke="#087f75" stroke-width="2"/>
<text x="178.00" y="215.00" font-size="24" fill="#2563eb" style="fill:#2563eb" text-anchor="middle" font-weight="400">i</text>
<text x="562.00" y="215.00" font-size="24" fill="#087f75" style="fill:#087f75" text-anchor="middle" font-weight="400">j</text>
<text x="82.00" y="215.00" font-size="24" fill="#087f75" style="fill:#087f75" text-anchor="middle" font-weight="400">j′</text>
<line x1="195.00" y1="254.00" x2="544.00" y2="254.00" stroke="#486174" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="370.00" y="240.00" font-size="22" fill="#182f43" style="fill:#182f43" text-anchor="middle" font-weight="400">|Δx| = 0.8L</text>
<line x1="86.00" y1="305.00" x2="176.00" y2="305.00" stroke="#c46818" stroke-width="3" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="139.00" y="340.00" font-size="20" fill="#c46818" style="fill:#c46818" text-anchor="middle" font-weight="400">rmin = 0.2L</text>
<line x1="130.00" y1="400.00" x2="610.00" y2="400.00" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="370.00" y="429.00" font-size="22" fill="#2563eb" style="fill:#2563eb" text-anchor="middle" font-weight="400">L</text>
<text x="30.00" y="492.00" font-size="18" fill="#486174" style="fill:#486174" text-anchor="start" font-weight="400">Δxmin = Δx − L round(Δx/L); apply per axis in an orthorhombic box.</text>
</svg>
