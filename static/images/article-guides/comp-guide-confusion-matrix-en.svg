<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img"><title>Read the counts before the scores</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526678"/></marker></defs><rect width="760" height="460" rx="16" fill="#f7fafc"/>
<text x="30" y="42" font-family="&quot;Microsoft YaHei&quot;,&quot;Noto Sans SC&quot;,Arial,sans-serif" font-size="26" fill="#203348" text-anchor="start" font-weight="600">Read the counts before the scores</text>
<text x="30" y="76" font-family="&quot;Microsoft YaHei&quot;,&quot;Noto Sans SC&quot;,Arial,sans-serif" font-size="18" fill="#526678" text-anchor="start" font-weight="400">Teaching data: 20 binary classifications</text>
<rect x="30" y="122" width="188" height="66" rx="0" fill="#eaf1fa" stroke="#d6e1ec"/>
<text x="124.0" y="162.0" font-family="&quot;Microsoft YaHei&quot;,&quot;Noto Sans SC&quot;,Arial,sans-serif" font-size="20" fill="#203348" text-anchor="middle" font-weight="600">Actual / predicted</text>
<rect x="218" y="122" width="110" height="66" rx="0" fill="#eaf1fa" stroke="#d6e1ec"/>
<text x="273.0" y="162.0" font-family="&quot;Microsoft YaHei&quot;,&quot;Noto Sans SC&quot;,Arial,sans-serif" font-size="20" fill="#203348" text-anchor="middle" font-weight="600">+</text>
<rect x="328" y="122" width="110" height="66" rx="0" fill="#eaf1fa" stroke="#d6e1ec"/>
<text x="383.0" y="162.0" font-family="&quot;Microsoft YaHei&quot;,&quot;Noto Sans SC&quot;,Arial,sans-serif" font-size="20" fill="#203348" text-anchor="middle" font-weight="600">−</text>
<rect x="30" y="188" width="188" height="66" rx="0" fill="white" stroke="#d6e1ec"/>
<text x="124.0" y="228.0" font-family="&quot;Microsoft YaHei&quot;,&quot;Noto Sans SC&quot;,Arial,sans-serif" font-size="20" fill="#203348" text-anchor="middle" font-weight="400">+</text>
<rect x="218" y="188" width="110" height="66" rx="0" fill="white" stroke="#d6e1ec"/>
<text x="273.0" y="228.0" font-family="&quot;Microsoft YaHei&quot;,&quot;Noto Sans SC&quot;,Arial,sans-serif" font-size="20" fill="#203348" text-anchor="middle" font-weight="400">8</text>
<rect x="328" y="188" width="110" height="66" rx="0" fill="white" stroke="#d6e1ec"/>
<text x="383.0" y="228.0" font-family="&quot;Microsoft YaHei&quot;,&quot;Noto Sans SC&quot;,Arial,sans-serif" font-size="20" fill="#203348" text-anchor="middle" font-weight="400">1</text>
<rect x="30" y="254" width="188" height="66" rx="0" fill="white" stroke="#d6e1ec"/>
<text x="124.0" y="294.0" font-family="&quot;Microsoft YaHei&quot;,&quot;Noto Sans SC&quot;,Arial,sans-serif" font-size="20" fill="#203348" text-anchor="middle" font-weight="400">−</text>
<rect x="218" y="254" width="110" height="66" rx="0" fill="white" stroke="#d6e1ec"/>
<text x="273.0" y="294.0" font-family="&quot;Microsoft YaHei&quot;,&quot;Noto Sans SC&quot;,Arial,sans-serif" font-size="20" fill="#203348" text-anchor="middle" font-weight="400">2</text>
<rect x="328" y="254" width="110" height="66" rx="0" fill="white" stroke="#d6e1ec"/>
<text x="383.0" y="294.0" font-family="&quot;Microsoft YaHei&quot;,&quot;Noto Sans SC&quot;,Arial,sans-serif" font-size="20" fill="#203348" text-anchor="middle" font-weight="400">9</text>
<text x="452" y="150" font-family="&quot;Microsoft YaHei&quot;,&quot;Noto Sans SC&quot;,Arial,sans-serif" font-size="21" fill="#386fd1" text-anchor="start" font-weight="600">Precision</text>
<text x="452" y="181" font-family="&quot;Microsoft YaHei&quot;,&quot;Noto Sans SC&quot;,Arial,sans-serif" font-size="19" fill="#203348" text-anchor="start" font-weight="400">8 / (8 + 2) = 0.800</text>
<text x="452" y="224" font-family="&quot;Microsoft YaHei&quot;,&quot;Noto Sans SC&quot;,Arial,sans-serif" font-size="21" fill="#13887f" text-anchor="start" font-weight="600">Recall</text>
<text x="452" y="255" font-family="&quot;Microsoft YaHei&quot;,&quot;Noto Sans SC&quot;,Arial,sans-serif" font-size="19" fill="#203348" text-anchor="start" font-weight="400">8 / (8 + 1) ≈ 0.889</text>
<text x="452" y="298" font-family="&quot;Microsoft YaHei&quot;,&quot;Noto Sans SC&quot;,Arial,sans-serif" font-size="21" fill="#ca7b37" text-anchor="start" font-weight="600">Accuracy</text>
<text x="452" y="329" font-family="&quot;Microsoft YaHei&quot;,&quot;Noto Sans SC&quot;,Arial,sans-serif" font-size="19" fill="#203348" text-anchor="start" font-weight="400">(8 + 9) / 20 = 0.850</text>
<text x="30" y="437" font-family="&quot;Microsoft YaHei&quot;,&quot;Noto Sans SC&quot;,Arial,sans-serif" font-size="18" fill="#526678" text-anchor="start" font-weight="400">False positives = 2; false negatives = 1. The costs can differ.</text></svg>