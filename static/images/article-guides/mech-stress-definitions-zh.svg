<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540" role="img" aria-labelledby="title desc" xml:lang="zh">
<title id="title">明确应力与应变的参考几何</title><desc id="desc">工程量采用初始长度与初始截面积。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans SC","Noto Sans CJK SC",Arial,sans-serif;fill:#182f43}path,line,polyline{stroke-linecap:round;stroke-linejoin:round}</style>
<rect x="1" y="1" width="758" height="538" rx="16" fill="#f8fafc" stroke="#dce5ec"/>
<text x="30.00" y="42.00" font-size="27" fill="#182f43" style="fill:#182f43" text-anchor="start" font-weight="700">明确应力与应变的参考几何</text>
<text x="30.00" y="72.00" font-size="18" fill="#486174" style="fill:#486174" text-anchor="start" font-weight="400">工程量采用初始长度与初始截面积。</text>
<rect x="110" y="180" width="220" height="66" rx="3" fill="#dfebf5" stroke="#2563eb" stroke-width="2"/>
<text x="45.00" y="215.00" font-size="19" fill="#182f43" style="fill:#182f43" text-anchor="start" font-weight="400">初始</text>
<line x1="110.00" y1="159.00" x2="330.00" y2="159.00" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="220.00" y="148.00" font-size="22" fill="#2563eb" style="fill:#2563eb" text-anchor="middle" font-weight="400">L₀</text>
<rect x="87" y="320" width="266" height="48" rx="3" fill="#dfebf5" stroke="#087f75" stroke-width="2"/>
<text x="220.00" y="414.00" font-size="19" fill="#182f43" style="fill:#182f43" text-anchor="middle" font-weight="400">拉伸后</text>
<line x1="87.00" y1="299.00" x2="353.00" y2="299.00" stroke="#087f75" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="220.00" y="288.00" font-size="22" fill="#087f75" style="fill:#087f75" text-anchor="middle" font-weight="400">L</text>
<text x="345.00" y="221.00" font-size="23" fill="#2563eb" style="fill:#2563eb" text-anchor="start" font-weight="400">A₀</text>
<text x="375.00" y="383.00" font-size="23" fill="#087f75" style="fill:#087f75" text-anchor="start" font-weight="400">A</text>
<line x1="82.00" y1="344.00" x2="42.00" y2="344.00" stroke="#c46818" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="358.00" y1="344.00" x2="405.00" y2="344.00" stroke="#c46818" stroke-width="3" marker-end="url(#arrow)"/>
<text x="417.00" y="350.00" font-size="23" fill="#c46818" style="fill:#c46818" text-anchor="start" font-weight="400">F</text>
<text x="455.00" y="188.00" font-size="22" fill="#182f43" style="fill:#182f43" text-anchor="start" font-weight="400">εeng = (L − L₀) / L₀</text>
<text x="455.00" y="260.00" font-size="22" fill="#182f43" style="fill:#182f43" text-anchor="start" font-weight="400">σeng = F / A₀</text>
<text x="455.00" y="332.00" font-size="22" fill="#182f43" style="fill:#182f43" text-anchor="start" font-weight="400">σtrue = F / A</text>
<text x="30.00" y="492.00" font-size="18" fill="#486174" style="fill:#486174" text-anchor="start" font-weight="400">变形后的截面积应由测量或明确的材料假设确定。</text>
</svg>
