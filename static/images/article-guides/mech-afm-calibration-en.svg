<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Separate cantilever bending from indentation</title><desc id="desc">After contact: piezo advance is shared by bending and indentation.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans SC","Noto Sans CJK SC",Arial,sans-serif;fill:#182f43}path,line,polyline{stroke-linecap:round;stroke-linejoin:round}</style>
<rect x="1" y="1" width="758" height="538" rx="16" fill="#f8fafc" stroke="#dce5ec"/>
<text x="30.00" y="42.00" font-size="27" fill="#182f43" style="fill:#182f43" text-anchor="start" font-weight="700">Separate cantilever bending from indentation</text>
<text x="30.00" y="72.00" font-size="18" fill="#486174" style="fill:#486174" text-anchor="start" font-weight="400">After contact: piezo advance is shared by bending and indentation.</text>
<path d="M55.000,305.000 L285.000,305.000 L301.000,340.000 L311.000,345.000 L321.000,340.000 L337.000,305.000 L385.000,305.000 L385.000,415.000 L55.000,415.000 Z" stroke="#96bfb3" stroke-width="2" fill="#d9eee9"/>
<line x1="55.00" y1="305.00" x2="385.00" y2="305.00" stroke="#486174" stroke-width="1" stroke-dasharray="5 5"/>
<path d="M75.000,230.000 L290.000,190.000 L311.000,235.000" stroke="#2563eb" stroke-width="7" fill="none"/>
<path d="M295.000,235.000 L327.000,235.000 L311.000,345.000 Z" stroke="#182f43" stroke-width="2" fill="#9eb5c9"/>
<line x1="350.00" y1="305.00" x2="350.00" y2="345.00" stroke="#c46818" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="363.00" y="333.00" font-size="24" fill="#c46818" style="fill:#c46818" text-anchor="start" font-weight="400">δ</text>
<line x1="75.00" y1="230.00" x2="290.00" y2="230.00" stroke="#486174" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="281.00" y1="192.00" x2="281.00" y2="227.00" stroke="#087f75" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="293.00" y="209.00" font-size="23" fill="#087f75" style="fill:#087f75" text-anchor="start" font-weight="400">d</text>
<text x="455.00" y="181.00" font-size="26" fill="#087f75" style="fill:#087f75" text-anchor="start" font-weight="400">d = S × V</text>
<text x="455.00" y="235.00" font-size="26" fill="#2563eb" style="fill:#2563eb" text-anchor="start" font-weight="400">F = k × d</text>
<text x="455.00" y="289.00" font-size="26" fill="#c46818" style="fill:#c46818" text-anchor="start" font-weight="400">δ = Δz − d</text>
<text x="455.00" y="345.00" font-size="20" fill="#182f43" style="fill:#182f43" text-anchor="start" font-weight="400">S: deflection</text>
<text x="455.00" y="373.00" font-size="20" fill="#182f43" style="fill:#182f43" text-anchor="start" font-weight="400">sensitivity; k:</text>
<text x="455.00" y="401.00" font-size="20" fill="#182f43" style="fill:#182f43" text-anchor="start" font-weight="400">calibrated spring</text>
<text x="455.00" y="429.00" font-size="20" fill="#182f43" style="fill:#182f43" text-anchor="start" font-weight="400">constant.</text>
<text x="30.00" y="492.00" font-size="18" fill="#486174" style="fill:#486174" text-anchor="start" font-weight="400">Choose positive Δz into contact; subtract baselines and contact</text>
<text x="30.00" y="517.20" font-size="18" fill="#486174" style="fill:#486174" text-anchor="start" font-weight="400">offsets first.</text>
</svg>
