<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Convert pixels into a local fiber width</title><desc id="desc">A straight strip makes the distance-transform definition visible.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans SC","Noto Sans CJK SC",Arial,sans-serif;fill:#182f43}path,line,polyline{stroke-linecap:round;stroke-linejoin:round}</style>
<rect x="1" y="1" width="758" height="538" rx="16" fill="#f8fafc" stroke="#dce5ec"/>
<text x="30.00" y="42.00" font-size="27" fill="#182f43" style="fill:#182f43" text-anchor="start" font-weight="700">Convert pixels into a local fiber width</text>
<text x="30.00" y="72.00" font-size="18" fill="#486174" style="fill:#486174" text-anchor="start" font-weight="400">A straight strip makes the distance-transform definition visible.</text>
<rect x="74" y="188" width="333" height="104" rx="0" fill="#dce8f9" stroke="#9cb5da" stroke-width="2"/>
<line x1="74.00" y1="240.00" x2="407.00" y2="240.00" stroke="#c46818" stroke-width="3" stroke-dasharray="6 5"/>
<circle cx="239.00" cy="240.00" r="6" fill="#c46818" stroke="none" stroke-width="2"/>
<line x1="239.00" y1="238.00" x2="239.00" y2="190.00" stroke="#087f75" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="258.00" y="218.00" font-size="23" fill="#087f75" style="fill:#087f75" text-anchor="start" font-weight="400">rpx</text>
<line x1="98.00" y1="188.00" x2="98.00" y2="292.00" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="112.00" y="283.00" font-size="22" fill="#2563eb" style="fill:#2563eb" text-anchor="start" font-weight="400">2rpx</text>
<text x="476.00" y="198.00" font-size="27" fill="#182f43" style="fill:#182f43" text-anchor="start" font-weight="600">d = 2rpx × s</text>
<text x="476.00" y="245.00" font-size="20" fill="#182f43" style="fill:#182f43" text-anchor="start" font-weight="400">s: length per pixel</text>
<text x="476.00" y="300.00" font-size="20" fill="#182f43" style="fill:#182f43" text-anchor="start" font-weight="400">Evaluate on the</text>
<text x="476.00" y="328.00" font-size="20" fill="#182f43" style="fill:#182f43" text-anchor="start" font-weight="400">centerline</text>
<line x1="90.00" y1="370.00" x2="190.00" y2="370.00" stroke="#182f43" stroke-width="5"/>
<line x1="90.00" y1="361.00" x2="90.00" y2="379.00" stroke="#182f43" stroke-width="2"/>
<line x1="190.00" y1="361.00" x2="190.00" y2="379.00" stroke="#182f43" stroke-width="2"/>
<text x="141.00" y="410.00" font-size="20" fill="#182f43" style="fill:#182f43" text-anchor="middle" font-weight="400">Calibration</text>
<text x="263.00" y="378.00" font-size="21" fill="#182f43" style="fill:#182f43" text-anchor="start" font-weight="400">At branches, crossings and edges,</text>
<text x="263.00" y="407.40" font-size="21" fill="#182f43" style="fill:#182f43" text-anchor="start" font-weight="400">review width estimates separately.</text>
<text x="30.00" y="492.00" font-size="18" fill="#486174" style="fill:#486174" text-anchor="start" font-weight="400">Local diameter is twice the nearest-boundary distance for this strip</text>
<text x="30.00" y="517.20" font-size="18" fill="#486174" style="fill:#486174" text-anchor="start" font-weight="400">geometry.</text>
</svg>
