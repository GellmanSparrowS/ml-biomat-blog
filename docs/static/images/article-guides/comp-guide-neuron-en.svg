<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img"><title>One neuron: weighted sum, then activation</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526678"/></marker></defs><rect width="760" height="460" rx="16" fill="#f7fafc"/>
<text x="30" y="42" font-family="&quot;Microsoft YaHei&quot;,&quot;Noto Sans SC&quot;,Arial,sans-serif" font-size="26" fill="#203348" text-anchor="start" font-weight="600">One neuron: weighted sum, then activation</text>
<text x="30" y="76" font-family="&quot;Microsoft YaHei&quot;,&quot;Noto Sans SC&quot;,Arial,sans-serif" font-size="18" fill="#526678" text-anchor="start" font-weight="400">Teaching example: x = (2, −1), w = (0.5, 1), b = 0.2</text>
<circle cx="100" cy="176" r="38" fill="white" stroke="#386fd1" stroke-width="2.5"/>
<text x="100" y="183" font-family="&quot;Microsoft YaHei&quot;,&quot;Noto Sans SC&quot;,Arial,sans-serif" font-size="21" fill="#203348" text-anchor="middle" font-weight="600">2</text>
<circle cx="100" cy="298" r="38" fill="white" stroke="#386fd1" stroke-width="2.5"/>
<text x="100" y="305" font-family="&quot;Microsoft YaHei&quot;,&quot;Noto Sans SC&quot;,Arial,sans-serif" font-size="21" fill="#203348" text-anchor="middle" font-weight="600">−1</text>
<line x1="142" y1="180" x2="285" y2="229" stroke="#386fd1" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="142" y1="295" x2="285" y2="249" stroke="#13887f" stroke-width="3" marker-end="url(#arrow)"/>
<text x="202" y="177" font-family="&quot;Microsoft YaHei&quot;,&quot;Noto Sans SC&quot;,Arial,sans-serif" font-size="20" fill="#386fd1" text-anchor="middle" font-weight="400">× 0.5</text>
<text x="199" y="309" font-family="&quot;Microsoft YaHei&quot;,&quot;Noto Sans SC&quot;,Arial,sans-serif" font-size="20" fill="#13887f" text-anchor="middle" font-weight="400">× 1</text>
<rect x="296" y="190" width="160" height="98" rx="9" fill="white" stroke="#d6e1ec"/>
<text x="376" y="230" font-family="&quot;Microsoft YaHei&quot;,&quot;Noto Sans SC&quot;,Arial,sans-serif" font-size="21" fill="#203348" text-anchor="middle" font-weight="400">Sum + bias</text>
<text x="376" y="265" font-family="&quot;Microsoft YaHei&quot;,&quot;Noto Sans SC&quot;,Arial,sans-serif" font-size="24" fill="#203348" text-anchor="middle" font-weight="600">z = 0.2</text>
<line x1="462" y1="239" x2="522" y2="239" stroke="#526678" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="535" y="190" width="195" height="98" rx="9" fill="white" stroke="#d6e1ec"/>
<text x="632" y="229" font-family="&quot;Microsoft YaHei&quot;,&quot;Noto Sans SC&quot;,Arial,sans-serif" font-size="24" fill="#386fd1" text-anchor="middle" font-weight="400">ReLU(z)</text>
<text x="632" y="265" font-family="&quot;Microsoft YaHei&quot;,&quot;Noto Sans SC&quot;,Arial,sans-serif" font-size="18" fill="#203348" text-anchor="middle" font-weight="400">max(0, z) = 0.2</text>
<text x="380" y="365" font-family="&quot;Microsoft YaHei&quot;,&quot;Noto Sans SC&quot;,Arial,sans-serif" font-size="23" fill="#203348" text-anchor="middle" font-weight="400">2 × 0.5 + (−1) × 1 + 0.2 = 0.2</text>
<text x="30" y="437" font-family="&quot;Microsoft YaHei&quot;,&quot;Noto Sans SC&quot;,Arial,sans-serif" font-size="18" fill="#526678" text-anchor="start" font-weight="400">Weights set each input contribution; the activation maps the result.</text></svg>