<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">What grompp and mdrun exchange</title><desc id="desc">Coordinates, interactions and run settings meet in the binary input.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans SC","Noto Sans CJK SC",Arial,sans-serif;fill:#182f43}path,line,polyline{stroke-linecap:round;stroke-linejoin:round}</style>
<rect x="1" y="1" width="758" height="538" rx="16" fill="#f8fafc" stroke="#dce5ec"/>
<text x="30.00" y="42.00" font-size="27" fill="#182f43" style="fill:#182f43" text-anchor="start" font-weight="700">What grompp and mdrun exchange</text>
<text x="30.00" y="72.00" font-size="18" fill="#486174" style="fill:#486174" text-anchor="start" font-weight="400">Coordinates, interactions and run settings meet in the binary input.</text>
<rect x="35" y="145" width="240" height="76" rx="8" fill="#eef4f9" stroke="#dce5ec" stroke-width="2"/>
<text x="155.00" y="175.00" font-size="23" fill="#2563eb" style="fill:#2563eb" text-anchor="middle" font-weight="600">.gro</text>
<text x="155.00" y="204.00" font-size="18" fill="#182f43" style="fill:#182f43" text-anchor="middle" font-weight="400">Coordinates</text>
<line x1="280.00" y1="183.00" x2="320.00" y2="282.00" stroke="#486174" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="35" y="245" width="240" height="76" rx="8" fill="#eef4f9" stroke="#dce5ec" stroke-width="2"/>
<text x="155.00" y="275.00" font-size="23" fill="#2563eb" style="fill:#2563eb" text-anchor="middle" font-weight="600">.top + .itp</text>
<text x="155.00" y="304.00" font-size="18" fill="#182f43" style="fill:#182f43" text-anchor="middle" font-weight="400">Topology + parameters</text>
<line x1="280.00" y1="283.00" x2="320.00" y2="282.00" stroke="#486174" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="35" y="345" width="240" height="76" rx="8" fill="#eef4f9" stroke="#dce5ec" stroke-width="2"/>
<text x="155.00" y="375.00" font-size="23" fill="#2563eb" style="fill:#2563eb" text-anchor="middle" font-weight="600">.mdp</text>
<text x="155.00" y="404.00" font-size="18" fill="#182f43" style="fill:#182f43" text-anchor="middle" font-weight="400">Run settings</text>
<line x1="280.00" y1="383.00" x2="320.00" y2="282.00" stroke="#486174" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="330" y="245" width="155" height="76" rx="8" fill="#dfefeb" stroke="#94c9bd" stroke-width="2"/>
<text x="407.00" y="276.00" font-size="21" fill="#087f75" style="fill:#087f75" text-anchor="middle" font-weight="600">gmx grompp</text>
<text x="407.00" y="304.00" font-size="22" fill="#182f43" style="fill:#182f43" text-anchor="middle" font-weight="400">.tpr</text>
<line x1="493.00" y1="282.00" x2="539.00" y2="282.00" stroke="#486174" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="550" y="245" width="175" height="76" rx="8" fill="#e5edfb" stroke="#a6bdf0" stroke-width="2"/>
<text x="637.00" y="288.00" font-size="23" fill="#2563eb" style="fill:#2563eb" text-anchor="middle" font-weight="600">gmx mdrun</text>
<line x1="637.00" y1="328.00" x2="637.00" y2="355.00" stroke="#486174" stroke-width="2" marker-end="url(#arrow)"/>
<text x="637.00" y="386.00" font-size="22" fill="#182f43" style="fill:#182f43" text-anchor="middle" font-weight="400">.xtc  .edr</text>
<text x="637.00" y="415.00" font-size="22" fill="#182f43" style="fill:#182f43" text-anchor="middle" font-weight="400">.log  .cpt</text>
<text x="30.00" y="492.00" font-size="18" fill="#486174" style="fill:#486174" text-anchor="start" font-weight="400">Keep each stage’s settings, topology, coordinates and checkpoint</text>
<text x="30.00" y="517.20" font-size="18" fill="#486174" style="fill:#486174" text-anchor="start" font-weight="400">together.</text>
</svg>
