<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img"><title>预处理参数只从训练数据中计算</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526678"/></marker></defs><rect width="760" height="460" rx="16" fill="#f7fafc"/>
<text x="30" y="42" font-family="&quot;Microsoft YaHei&quot;,&quot;Noto Sans SC&quot;,Arial,sans-serif" font-size="26" fill="#203348" text-anchor="start" font-weight="600">预处理参数只从训练数据中计算</text>
<text x="30" y="76" font-family="&quot;Microsoft YaHei&quot;,&quot;Noto Sans SC&quot;,Arial,sans-serif" font-size="18" fill="#526678" text-anchor="start" font-weight="400">教学数值；标准差采用 StandardScaler 的总体标准差定义</text>
<rect x="30" y="118" width="330" height="225" rx="9" fill="white" stroke="#d6e1ec"/>
<text x="195" y="156" font-family="&quot;Microsoft YaHei&quot;,&quot;Noto Sans SC&quot;,Arial,sans-serif" font-size="23" fill="#386fd1" text-anchor="middle" font-weight="600">训练集：[2, 4, 6]</text>
<text x="195" y="205" font-family="&quot;Microsoft YaHei&quot;,&quot;Noto Sans SC&quot;,Arial,sans-serif" font-size="23" fill="#203348" text-anchor="middle" font-weight="400">mean = 4</text>
<text x="195" y="246" font-family="&quot;Microsoft YaHei&quot;,&quot;Noto Sans SC&quot;,Arial,sans-serif" font-size="22" fill="#203348" text-anchor="middle" font-weight="400">std = √(8/3) ≈ 1.633</text>
<text x="195" y="299" font-family="&quot;Microsoft YaHei&quot;,&quot;Noto Sans SC&quot;,Arial,sans-serif" font-size="20" fill="#203348" text-anchor="middle" font-weight="400">计算一次，保留参数</text>
<line x1="367" y1="231" x2="401" y2="231" stroke="#526678" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="410" y="118" width="320" height="225" rx="9" fill="white" stroke="#d6e1ec"/>
<text x="570" y="156" font-family="&quot;Microsoft YaHei&quot;,&quot;Noto Sans SC&quot;,Arial,sans-serif" font-size="23" fill="#13887f" text-anchor="middle" font-weight="600">测试集：[8]</text>
<text x="570" y="213" font-family="&quot;Microsoft YaHei&quot;,&quot;Noto Sans SC&quot;,Arial,sans-serif" font-size="21" fill="#203348" text-anchor="middle" font-weight="400">z = (8 − 4) / √(8/3)</text>
<text x="570" y="259" font-family="&quot;Microsoft YaHei&quot;,&quot;Noto Sans SC&quot;,Arial,sans-serif" font-size="26" fill="#13887f" text-anchor="middle" font-weight="400">≈ 2.449</text>
<text x="570" y="303" font-family="&quot;Microsoft YaHei&quot;,&quot;Noto Sans SC&quot;,Arial,sans-serif" font-size="20" fill="#203348" text-anchor="middle" font-weight="400">沿用训练集参数</text>
<text x="30" y="437" font-family="&quot;Microsoft YaHei&quot;,&quot;Noto Sans SC&quot;,Arial,sans-serif" font-size="18" fill="#526678" text-anchor="start" font-weight="400">若在测试集重新拟合缩放器，就改变了数据的坐标基准。</text></svg>