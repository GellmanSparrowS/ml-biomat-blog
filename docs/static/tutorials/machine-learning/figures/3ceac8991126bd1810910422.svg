<svg role="img" aria-label="Text conditions a latent denoiser; repeated latent updates are followed by image decoding." xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440"><rect width="1120" height="440" fill="#faf9f5"/><defs><marker id="M34-F5-a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#44515c"/></marker></defs><g font-family="Microsoft YaHei,Arial,sans-serif"><rect x="30" y="50" width="200" height="75" rx="9" fill="#e5efd9" stroke="#60717e"/><text x="130.0" y="80" text-anchor="middle" font-size="20" fill="#162f41">Text condition</text><text x="130.0" y="107" text-anchor="middle" font-size="16" fill="#42535d">Text → vectors</text><rect x="295" y="175" width="210" height="90" rx="9" fill="#f6dce9" stroke="#60717e"/><text x="400.0" y="205" text-anchor="middle" font-size="20" fill="#162f41">Noisy latent tensor</text><text x="400.0" y="232" text-anchor="middle" font-size="16" fill="#42535d">64 × 64 × 4</text><rect x="575" y="175" width="220" height="90" rx="9" fill="#f6dce9" stroke="#60717e"/><text x="685.0" y="205" text-anchor="middle" font-size="20" fill="#162f41">Latent denoiser</text><text x="685.0" y="232" text-anchor="middle" font-size="16" fill="#42535d">Time + condition</text><rect x="860" y="175" width="200" height="90" rx="9" fill="#d7eaf2" stroke="#60717e"/><text x="960.0" y="205" text-anchor="middle" font-size="20" fill="#162f41">Image decoder</text><text x="960.0" y="232" text-anchor="middle" font-size="16" fill="#42535d">512 × 512 × 3</text><g fill="none" stroke="#44515c" stroke-width="2.4" marker-end="url(#M34-F5-a)"><path d="M230 90 H685 V170"/><path d="M505 220 H570"/><path d="M795 220 H855"/><path d="M685 270 V330 H400 V270"/></g><text x="350" y="75" font-size="17">Cross-attention supplies conditioning</text><text x="540" y="355" text-anchor="middle" font-size="19">Repeated latent updates: t → lower t</text><text x="825" y="200" text-anchor="middle" font-size="15">t=0</text><text x="30" y="405" font-size="15" fill="#596873">Adapted from Diffusion Explainer architecture; shapes illustrate computational scale.</text></g></svg>