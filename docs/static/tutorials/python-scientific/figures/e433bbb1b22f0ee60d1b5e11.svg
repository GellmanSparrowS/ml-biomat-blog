   </g>
   <g id="P02-F3-text_12">
    <text style="font-size: 14px; font-family: 'DejaVu Sans', Arial, 'Microsoft YaHei', sans-serif; text-anchor: start; fill: #172b36" x="28.649988" y="365.990091" transform="rotate(-0 28.649988 365.990091)">Today’s metre: the distance light travels in vacuum in 1/299792458 second.</text>
   </g>
   <g id="P02-F3-text_13">
    <text style="font-size: 13px; font-family: 'DejaVu Sans', Arial, 'Microsoft YaHei', sans-serif; text-anchor: start; fill: #172b36" x="28.649988" y="415.723371" transform="rotate(-0 28.649988 415.723371)">A shared unit definition and practical measurement precision are distinct, connected questions.</text>
